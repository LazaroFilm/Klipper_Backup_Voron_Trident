#####################################################################
##                  Heated Bed
#####################################################################
[heater_bed]
heater_pin: PA1                        # (BE0) Heater pin
sensor_pin: PB1                        # Sensor interface (TB) sensor pin
sensor_type: ATC Semitec 104GT-2       # ATC Semitec 104GT-2 temperature sensor type
#control: pid                           # Control method
## Heated bed temperature PID calibration command: "PID_CALIBRATE HEATER=heater_bed TARGET=100"
#pid_kp: 53.467                         # PID Kp value
#pid_ki: 0.931                          # PID Ki value
#pid_kd: 767.921                        # PID Kd value
min_temp: -20                          # Minimum temperature
max_temp: 135                          # Maximum temperature
max_power: 1.0                         # Maximum power
# pwm_cycle_time: 0.008333               # increase PWM freq. to reduce house light flickering Doesn't work with AC bed heaters. Use values below.
# pwm_cycle_time: 0.02227 # 44.9Hz
pwm_cycle_time: 0.02088 # 47.9Hz

#####################################################################
##                          Idle Timeout for Heated Bed
#####################################################################

[idle_timeout]
timeout: 1800                # Turn off heated bed if idle for more than 30 minutes

#####################################################################
# 	                 Cartographer V3 （ADXL345）
#####################################################################

[scanner]
canbus_uuid: 6b309418501c
#    Fill in the UUID that was just recorded           
x_offset: 0                          
#    adjust for your cartographers offset from nozzle to middle of coil
y_offset: 23                         
#    adjust for your cartographers offset from nozzle to middle of coil
backlash_comp: 0.00386
#   Backlash compensation distance for removing Z backlash before measuring
#   the sensor response.
# 
#   Offsets are measured from the centre of your coil, to the tip of your nozzle 
#   on a level axis. It is vital that this is accurate. 
mode: touch
#    leave this as touch unless you want to use scan only for everything. 
sensor: cartographer
#    this must be set as cartographer unless using IDM etc.
sensor_alt: carto
#    alternate name to call commands. CARTO_TOUCH etc
#scanner_touch_z_offset: 0.05         
#    This is the default and will be overwritten and added to the DO NOT SAVE area by using UI to save z offset
mesh_runs: 2
#    Number of passes to make during mesh scan.


[adxl345]
cs_pin: scanner:PA3
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345             # Specifies ADXL345 accelerometer for resonance testing
probe_points:
    150, 150, 20                # Coordinates of the probe points for resonance testing
accel_per_hz: 100
sweeping_accel: 400
# sweeping_period: 1.2
sweeping_period: 0

#####################################################################
##                  Bed Mesh Calibration
#####################################################################
[bed_mesh]
zero_reference_position: 150,150  
#    This option is suitable for the 300 model. 
#    set this to the middle of your bed
speed: 200
#    movement speed of toolhead during bed mesh
horizontal_move_z: 5
#    height of scanner during bed mesh scan
mesh_min: 30, 30
#    start point of bed mesh [X, Y]
mesh_max: 270, 270
#    end point of bed mesh [X, Y]
probe_count: 30, 30
algorithm: bicubic
adaptive_margin: 5

[axis_twist_compensation]
speed: 200
horizontal_move_z: 5
# For X-axis twist compensation:
calibrate_start_x: 30
calibrate_end_x: 270
calibrate_y: 150
# For Y-axis twist compensation:
calibrate_start_y: 30
calibrate_end_y: 270
calibrate_x: 150
# AXIS_TWIST_COMPENSATION_CALIBRATE [AXIS=<X|Y>] [SAMPLE_COUNT=<value>]

[gcode_macro AXIS_TWIST_X]
gcode:
    AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=X SAMPLE_COUNT=3
    
[gcode_macro AXIS_TWIST_Y]
gcode:
    AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=Y SAMPLE_COUNT=3
    
    #####################################################################
    ##                  Fans
    #####################################################################
    
[heater_fan hotend_fan]          # Hotend fan
pin: EBBCan:gpio14               # Hotend fan pin
heater: extruder                 # Associated heating device
heater_temp: 50.0                # Temperature to start the fan
cycle_time: 0.00003                 # Cycle time

#--------------------------------------------------------------------

# [heater_fan Skirt_fan]           # Skirt fan 
# pin: PF9                         # FAN-2
# cycle_time: 0.00003              # Cycle time
# shutdown_speed: 0.0              # Closing speed (Please do not change)
# kick_start_time: 0.5             # start-up time (Please do not change)
# heater: heater_bed               # Related equipment: heater_bed
# heater_temp: 50                  # How many degrees does the heat bed reach to activate the fan
# fan_speed: 0.5                   # Fan speed. Default is 0.5

[temperature_fan _Skirt_fan]
pin:PF9
#max_power:
#shutdown_speed:
cycle_time: 0.00003
#hardware_pwm:
kick_start_time: 0.5
# off_below: 1
#tachometer_pin:
#tachometer_ppr:
#tachometer_poll_interval:
#enable_pin:
#   See the "fan" section for a description of the above parameters.
sensor_type: temperature_combined
sensor_list: temperature_sensor _CB2, temperature_sensor _Manta
combination_method: max
maximum_deviation: 999.9
#sensor_pin:
control: watermark
#max_delta:
min_temp: -99
max_temp: 100
#   See the "extruder" section for a description of the above parameters.
#pid_Kp:
#pid_Ki:
#pid_Kd:
#   The proportional (pid_Kp), integral (pid_Ki), and derivative
#   (pid_Kd) settings for the PID feedback control system. Klipper
#   evaluates the PID settings with the following general formula:
#     fan_pwm = max_power - (Kp*e + Ki*integral(e) - Kd*derivative(e)) / 255
#   Where "e" is "target_temperature - measured_temperature" and
#   "fan_pwm" is the requested fan rate with 0.0 being full off and
#   1.0 being full on. The pid_Kp, pid_Ki, and pid_Kd parameters must
#   be provided when the PID control algorithm is enabled.
#pid_deriv_time: 2.0
#   A time value (in seconds) over which temperature measurements will
#   be smoothed when using the PID control algorithm. This may reduce
#   the impact of measurement noise. The default is 2 seconds.
target_temp: 50.0
#   A temperature (in Celsius) that will be the target temperature.
#   The default is 40 degrees.
max_speed: 0.08 #   The fan speed (expressed as a value from 0.0 to 1.0) that the fan
#   will be set to when the sensor temperature exceeds the set value.
#   The default is 1.0.
min_speed: 0.3
#   The minimum fan speed (expressed as a value from 0.0 to 1.0) that
#   the fan will be set to for PID temperature fans.
#   The default is 0.3.
# gcode_id: SKIRT_FAN
#   If set, the temperature will be reported in M105 queries using the
#   given id. The default is to not report the temperature via M105.

#--------------------------------------------------------------------

[controller_fan driver_fan]      # Driver cooling fan
pin: PA6                         # Fan pin PF6
tachometer_pin: PC2
tachometer_ppr: 2
tachometer_poll_interval: 0.0015
cycle_time: 0.00003                  # Cycle time
max_power: 1.0                   # Maximum power
shutdown_speed: 0.0              # Shutdown speed
fan_speed: 1                   # Fan speed when heater or stepper driver is active (0.0 to 1.0). Default is 0.8
idle_timeout: 90                 # Time in seconds to keep the fan running after the stepper driver or heater is no longer active. Default is 30 seconds.
idle_speed: 0.5                  # Fan speed after the stepper driver is no longer active and before idle_timeout is reached (0.0 to 1.0). Default is fan_speed.
stepper: stepper_x               # Active motors
#Define the name of the heater/stepper configuration section associated with this fan. 
#If a comma-separated list of heater/stepper names is provided here, the fan will be enabled when any of the given heaters/steppers are enabled.
#The default heater is "extruder", and the default stepper is all steppers.

#--------------------------------------------------------------------

#Note: The following FAN0/FAN1/FAN2 settings are only applicable when using OrcaSlicer,
#as only OrcaSlicer allows for the additional configuration of parts cooling fans and filter fans. 
#If you use other slicing software, please comment out the following configurations.
# instead of using [fan], we define the default part cooling fan with [fan_generic] here
# this is the default part cooling fan

# [fan_generic fan0]               # fan0 5015 Part cooling Blower 
# pin: virtual_pin:fan0              # Fan pin 

[fan_generic Part_Cooling_Blower]               # fan0 5015 Part cooling Blower 
pin: EBBCan:gpio13               # Fan pin 
cycle_time: 0.00003                  # Cycle time
hardware_pwm: false              # hardware pwm

#--------------------------------------------------------------------
# [fan_generic fan2]               # fan2 12032 Auxiliary big Blower 
# pin: virtual_pin:fan2                         # Fan pin

[fan_generic Big_Blower]               # fan2 12032 Auxiliary big Blower 
pin: PA0                         # Fan pin
cycle_time: 0.00003              # Cycle time
hardware_pwm: false              # hardware pwm
kick_start_time: 0.5             # start-up time (Please do not change)

#--------------------------------------------------------------------

# [fan_generic fan3]               # fan3 Fume_Pack Exhaust Fan
# pin: virtual_pin:fan3                         # Fan pin     

[fan_generic Fume_Pack]               # fan3 Fume_Pack Exhaust Fan
pin: PF7                         # Fan pin     
cycle_time: 0.00003                 # Cycle time
hardware_pwm: false               # hardware pwm
kick_start_time: 0.5             # start-up time (Please do not change)

