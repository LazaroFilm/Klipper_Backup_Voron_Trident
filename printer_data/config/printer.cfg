[include mainsail.cfg]                  # Include configuration from mainsail.cfg file
[include motors_sync.cfg]               # Include AWD motors sync plugin
[include tmc_autotune.cfg]              # Include TMC Autotune plugin
[include macros.cfg]                    # Include Macros
[include timelapse.cfg]
[include wipe.cfg]
[include leds.cfg]
[include heatsoak.cfg]
# [include knomi.cfg]
[include shell_command.cfg]
[include AFC/*.cfg]
