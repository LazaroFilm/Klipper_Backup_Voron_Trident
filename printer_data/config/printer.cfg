# rename_existing: _SET_FAN_SPEED
# gcode:
#     {% set fan = 'fan' + (params.FAN|int if params.FAN is defined else 0)|string %}
#     # {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
#     {% set speed = params.SPEED|default(0.0)|float %}
#     {% if fan == 'fan0' %}
#         {% set new_fan = 'Part_Cooling_Blower'|string %}
#         _SET_FAN_SPEED FAN='Part_Cooling_Blower' SPEED={speed}
#         RESPOND TYPE=command MSG='Part_Cooling_Blower set to {speed}' 
#         # _SET_FAN_SPEED FAN=Part_Cooling_Blower SPEED={speed}
#     {% elif fan == 'fan2' %}
#         # {% set fan = 'Big_Blower'|string %}
#         _SET_FAN_SPEED FAN='Big_Blower' SPEED={speed}
#         RESPOND TYPE=command MSG='Big_Blower set to {speed}' 
#         # FAN = Big_Blower
#         # _SET_FAN_SPEED FAN=Big_Blower SPEED={speed}
#     {% elif fan == 'fan3' %}
#         # {% set fan = 'Fume_Pack'|string %}
#         _SET_FAN_SPEED FAN='Fume_Pack' SPEED={speed}
#         RESPOND TYPE=command MSG='Fume_Pack set to {speed}' 
#         # FAN = Fume_Pack
#         # _SET_FAN_SPEED FAN=Fume_Pack SPEED={speed}
#     {% else %}
#         _SET_FAN_SPEED FAN={fan} SPEED={speed}
#         RESPOND TYPE=command MSG='{fan} set to {speed}'
#     {% endif %}


[gcode_macro M106]
gcode:
    {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
    {% if fan == 'fan0' %}
        # {% set fan = 'Part_Cooling_Blower'|string %}
        SET_FAN_SPEED FAN=Part_Cooling_Blower SPEED={speed}
        # RESPOND TYPE=command MSG='Part_Cooling_Blower set to {speed}' 
    {% elif fan == 'fan2' %}
        # {% set fan = 'Big_Blower'|string %}
        {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
        SET_FAN_SPEED FAN=Big_Blower SPEED={speed}
        # RESPOND TYPE=command MSG='Big_Blower set to {speed}'
    {% elif fan == 'fan3' %}
        # {% set fan = 'Fume_Pack'|string %}
        {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
        SET_FAN_SPEED FAN=Fume_Pack SPEED={speed}
        # RESPOND TYPE=command MSG='Fume_Pack set to {speed}'
    {% else %}
        RESPOND TYPE=command MSG='M106 Fan speed error.'
    {% endif %}


####################################################################################
##                                    Homing Override
####################################################################################
# moved to macros.cfg

# [homing_override]
# axes: z                                         # Override homing for the Z axis only
# set_position_z: 0                               # Set the Z position to 0 after homing
# gcode:
#     G90                                         # Set to absolute positioning mode
#     G0 Z10 F1200                                # Move Z axis to 10mm above the bed at 1200 mm/min
#     G28 Y                                       # Home Y axis
#     G28 X                                       # Home X axis
#     G1 X150 Y150 F7200                          # Move to a specific coordinate (125, 125) at 7200 mm/min
#     G28 Z                                       # Home Z axis again


####################################################################################
##                                    Z Tilt Adjustment
####################################################################################
[z_tilt]
##  Use Z_TILT_ADJUST to level the bed.
##  z_positions: Location of toolhead

##--------------------------------------------------------------------
# Uncomment below for 300mm build
z_positions:
  -50, 18
  150, 348
  350, 18
points:
  50, 50
  150, 250
  250, 50

## Uncomment below for 350mm build
#z_positions:
#   -50, 18
#   175, 398
#   400, 18
#points:
#   50, 50
#   175, 300
#   300, 50
##--------------------------------------------------------------------

speed: 350                                      # Speed of Z tilt adjustment
horizontal_move_z: 2                            # Z axis move speed for adjustments
retries: 10                                     # Number of retries for adjustment points
retry_tolerance: 0.0075                         # Retry tolerance for adjustment accuracy

####################################################################################
##                                    Input Shaper
####################################################################################
[input_shaper]
shaper_type_x: 2hump_ei
shaper_freq_x: 133.0
damping_ratio_x: 0.089
shaper_type_y: ei
shaper_freq_y: 92.4
damping_ratio_y: 0.040

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 10
keep_raw_data: False
show_macros_in_webui: True
timeout: 600
measurements_chunk_size: 2
max_freq: 200
dpi: 300

####################################################################################
####################################################################################
[gcode_macro Z_TILT_ADJUST]     # IDM/Cartographer optimized 3Z leveling macro
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT         # Save current state for Z tilt adjustment
    BED_MESH_CLEAR                             # Clear bed mesh
    {% if not printer.z_tilt.applied %}
      _Z_TILT_ADJUST horizontal_move_z=10 retry_tolerance=1   # Adjust Z tilt with higher tolerance initially
    {% endif %}
    _Z_TILT_ADJUST horizontal_move_z=2          # Fine-tune Z tilt adjustment
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT       # Restore saved state after adjustment

####################################################################################
##                               Probe Calibration Macro
####################################################################################
[gcode_macro PROBECALIBRATE]
# Defines a G-code macro for probe calibration
gcode:
    G28 X Y                                     # Home XY axes
    G0 X150 Y150 Z1 F3600                       # Fast move to X150 Y150 Z1 at 3600 mm/min
    CARTOGRAPHER_TOUCH METHOD=manual            # Start probe calibration

####################################################################################
##                               Bed Leveling and Height Calibration Macro
####################################################################################
[gcode_macro G32]
# Defines a G-code macro for bed leveling and height calibration
gcode:
    BED_MESH_CLEAR                             # Clear bed mesh
    G28                                        # Home all axes
    Z_TILT_ADJUST                              # Perform gantry leveling
    G28                                        # Home all axes
    G0 X150 Y150 Z30 F3600                     # Fast move to X150 Y150 Z30 at 3600 mm/min

#--------------------------------------------------------------------
[gcode_macro DRAW_LINES]
gcode:
    G90                                        # Absolute positioning
    # G92 E0                                   # Reset Extruder (commented out for now)
    # G1 Z5.0  F7200                           # Move Z Axis up (commented out for now)
    G1 X50  Y0         F7200                   # Move to start position
    M83                                        # Set extruder to relative mode
    G1 E15 F400                                # Extrude filament
    G1 Z0.28 F7200                             # Lower Z axis
    G1 X200 Y0   Z0.28 F1200 E17               # Draw the first line
    G1 X200 Y0.4 Z0.28 F2400                   # Move to side a little
    G1 X55  Y0.4 Z0.28 F1200 E34               # Draw the second line
    G92 E0                        # Reset Extruder
    G90                           # Return to absolute positioning

#--------------------------------------------------------------------

# PRINT_START and PRINT_END moved to macro.cfg

#--------------------------------------------------------------------
# [gcode_macro PAUSE]
# description: Pause the actual running print
# rename_existing: PAUSE_BASE
# # change this if you need more or less extrusion
# variable_extrude: 1.0
# gcode:
#   ##### read E from pause macro #####
#   {% set E = printer["gcode_macro PAUSE"].extrude|float %}
#   ##### set park positon for x and y #####
#   # default is your max posion from your printer.cfg
#   {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
#   {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
#   ##### calculate save lift position #####
#   {% set max_z = printer.toolhead.axis_maximum.z|float %}
#   {% set act_z = printer.toolhead.position.z|float %}
#   {% if act_z < (max_z - 2.0) %}
#       {% set z_safe = 2.0 %}
#   {% else %}
#       {% set z_safe = max_z - act_z %}
#   {% endif %}
#   ##### end of definitions #####
#   PAUSE_BASE
#   G91
#   {% if printer.extruder.can_extrude|lower == 'true' %}
#     G1 E-{E} F2100
#   {% else %}
#     {action_respond_info("Extruder not hot enough")}
#   {% endif %}
#   {% if "xyz" in printer.toolhead.homed_axes %}
#     G1 Z{z_safe} F900
#     G90
#     G1 X{x_park} Y{y_park} F6000
#   {% else %}
#     {action_respond_info("Printer not homed")}
#   {% endif %} 
# #--------------------------------------------------------------------
# [gcode_macro RESUME]
# description: Resume the actual running print
# rename_existing: RESUME_BASE
# gcode:
#   ##### read E from pause macro #####
#   {% set E = printer["gcode_macro PAUSE"].extrude|float %}
#   #### get VELOCITY parameter if specified ####
#   {% if 'VELOCITY' in params|upper %}
#     {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
#   {%else %}
#     {% set get_params = "" %}
#   {% endif %}
#   ##### end of definitions #####
#   {% if printer.extruder.can_extrude|lower == 'true' %}
#     G91
#     G1 E{E} F2100
#   {% else %}
#     {action_respond_info("Extruder not hot enough")}
#   {% endif %}  
#   RESUME_BASE {get_params}
# #--------------------------------------------------------------------

# [gcode_macro CANCEL_PRINT]
# # Defines a G-code macro to cancel the actual running print
# description: Cancel the actual running print
# rename_existing: CANCEL_PRINT_BASE
# variable_park: True
# gcode: 
#     G28 Y                                     # Home Y axis
#     _TOOLHEAD_PARK_PAUSE_CANCEL               # Call _TOOLHEAD_PARK_PAUSE_CANCEL macro
#     TURN_OFF_HEATERS                          # Turn off all heaters
#     CANCEL_PRINT_BASE                         # Call CANCEL_PRINT_BASE to cancel print
#     FANS_OFF
#     RESET_SPEEDS

[gcode_macro DATA_SAMPLE]
gcode:
  {% set bed_temp = params.BED_TEMP|default(90)|int %}
  {% set nozzle_temp = params.NOZZLE_TEMP|default(250)|int %}
  {% set min_temp = params.MIN_TEMP|default(40)|int %}
  {% set max_temp = params.MAX_TEMP|default(70)|int %}
  G90
  M106 S255
  RESPOND TYPE=command MSG='Waiting for Coil to cool to 40'
  M117 Waiting for Coil to cool to 40
  TEMPERATURE_WAIT SENSOR='temperature_sensor cartographer_coil' MAXIMUM={min_temp}
  RESPOND TYPE=command MSG='Starting Phase 1 of 4'
  M117 Starting Phase 1 of 4
  M106 S0
  G28
  G0 Z1
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  G4 P1000
  TEMPERATURE_WAIT SENSOR='temperature_sensor cartographer_coil' MINIMUM={min_temp}
  CARTOGRAPHER_STREAM FILENAME=data1
  M117 Waiting for Coil to heat to 70
  RESPOND TYPE=command MSG='Waiting for Coil to heat to 70'
  TEMPERATURE_WAIT SENSOR='temperature_sensor cartographer_coil' MINIMUM={max_temp}
  CARTOGRAPHER_STREAM FILENAME=data1
  M104 S0
  M140 S0
  M106 S255
  G0 Z80
  RESPOND TYPE=command MSG='Waiting for Coil to cool to 40'
  M117 Waiting for Coil to cool to 40
  TEMPERATURE_WAIT SENSOR='temperature_sensor cartographer_coil' MAXIMUM={min_temp}
  M117 Starting Phase 2 of 4
  RESPOND TYPE=command MSG='Starting Phase 2 of 4'
  M106 S0
  G28 Z0
  G0 Z2
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  G4 P1000
  CARTOGRAPHER_STREAM FILENAME=data2
  M117 Waiting for Coil to heat to 70
  RESPOND TYPE=command MSG='Waiting for Coil to heat to 70'
  TEMPERATURE_WAIT SENSOR='temperature_sensor cartographer_coil' MINIMUM={max_temp}
  CARTOGRAPHER_STREAM FILENAME=data2
  M104 S0
  M140 S0
  M106 S255
  G0 Z80
  RESPOND TYPE=command MSG='Waiting for Coil to cool to 40'
  M117 Waiting for Coil to cool to 40
  TEMPERATURE_WAIT SENSOR='temperature_sensor cartographer_coil' MAXIMUM={min_temp}
  M117 "Starting Phase 3 of 4"
  RESPOND TYPE=command MSG='Starting Phase 3 of 4'
  M106 S0
  G28 Z0
  G0 Z3
  M104 S{nozzle_temp}
  M140 S{bed_temp}
  G4 P1000
  CARTOGRAPHER_STREAM FILENAME=data3
  M117 Waiting for Coil to heat to 70
  RESPOND TYPE=command MSG='Waiting for Coil to heat to 70'
  TEMPERATURE_WAIT SENSOR='temperature_sensor cartographer_coil' MINIMUM={max_temp}
  CARTOGRAPHER_STREAM FILENAME=data3
  M104 S0
  M140 S0
  RESPOND TYPE=command MSG='Testing complete, please move files using: mv ~/klipper/data1 ~/klipper/data2 ~/klipper/data3 ~/cartographer-klipper/'
  M117 "Testing complete, please move files using: mv ~/klipper/data1 ~/klipper/data2 ~/klipper/data3 ~/cartographer-klipper/"
  RESPOND TYPE=command MSG='Follow the remaining instructions here: https://docs.cartographer3d.com/cartographer-probe/advanced-features/temperature-differential-calibration-beta'
  M117 "Follow the remaining instructions here: https://docs.cartographer3d.com/cartographer-probe/advanced-features/temperature-differential-calibration-beta"

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : False ; use custom park coordinates for x,y [True/False]
variable_custom_park_x    : 100.0   ; custom x position; value must be within your defined min and max of X
variable_custom_park_y    : 310.0   ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 2.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
variable_retract          : 1.0   ; the value to retract while PAUSE
variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
variable_speed_retract    : 35.0  ; retract speed in mm/s
variable_unretract        : 1.0   ; the value to unretract while RESUME
variable_speed_unretract  : 35.0  ; unretract speed in mm/s
variable_speed_hop        : 15.0  ; z move speed in mm/s
variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : False ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
# !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
variable_use_fw_retract   : True ; use fw_retraction instead of the manual version [True/False]
variable_idle_timeout     : 1800     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
variable_runout_sensor    : "filament_switch_sensor runout_sensor"    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
#                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
# !!! Custom macros, please use with care and review the section of the corresponding macro.
# These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
# Only  single line commands are supported, please create a macro if you need more than one command.
variable_user_pause_macro : ""    ; Everything inside the "" will be executed after the klipper base pause (PAUSE_BASE) function
variable_user_resume_macro: ""    ; Everything inside the "" will be executed before the klipper base resume (RESUME_BASE) function
variable_user_cancel_macro: ""    ; Everything inside the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
