[force_move]
enable_force_move: True

[AFC_extruder extruder]
pin_tool_start: ^EBBCan:gpio22
#pin_tool_end: ^!nhk:gpio12
tool_stn: 122.0                # Distance from the toolhead sensor to the tip of the nozzle in mm.
tool_stn_unload: 105             # Unload distance for the toolhead in mm.
tool_sensor_after_extruder: 0   # Distance in mm.
tool_unload_speed: 25           # Unload speed in mm/s. Default is 25mm/s.
tool_load_speed: 15             # Load speed in mm/s. Default is 25mm/s.

[filament_switch_sensor bypass]
switch_pin: ^PC15
pause_on_runout: True


[AFC_buffer TN]
advance_pin: ^!NightOwl:TN_ADV    # set advance pin
trailing_pin: ^!NightOwl:TN_TRL  # set trailing pin
multiplier_high: 1.250   # default 1.05, factor to feed more filament
multiplier_low:  0.75   # default 0.95, factor to feed less filament

